name: Update Sigma 4 dependency lock on feature branch

on:
  push:
    branches: [feature/sigma4-drag-network]
    paths:
      - package.json
      - .github/workflows/update-sigma-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/sigma4-drag-network'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "Lock Sigma.js 4 dependencies" && git push)
